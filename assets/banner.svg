<svg width="830" height="260" viewBox="0 0 830 260" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  /* Noise grain overlay flicker */
  .grain { animation: grainShift 0.12s steps(1) infinite; }
  @keyframes grainShift {
    0%  { opacity: 0.04; }
    25% { opacity: 0.07; }
    50% { opacity: 0.03; }
    75% { opacity: 0.06; }
  }

  /* Slow ambient glow pulse */
  .glow-l { animation: glowPulse 8s ease-in-out infinite; }
  .glow-r { animation: glowPulse 10s ease-in-out 2s infinite reverse; }
  @keyframes glowPulse {
    0%,100% { opacity: 0.45; }
    50%      { opacity: 0.85; }
  }

  /* Border breathe */
  .bdr-t { animation: bdrBreath 5s ease-in-out infinite alternate; }
  .bdr-b { animation: bdrBreath 5s ease-in-out infinite alternate-reverse; }
  @keyframes bdrBreath {
    from { opacity: 0.4; }
    to   { opacity: 1.0; }
  }

  /* Scan line sweep */
  .scan { animation: scanMove 8s linear infinite; }
  @keyframes scanMove {
    0%   { transform: translateY(-60px); opacity: 1; }
    85%  { opacity: 1; }
    100% { transform: translateY(330px); opacity: 0; }
  }

  /* Corner L marks */
  .cr { animation: crFade 4s ease-in-out infinite; }
  @keyframes crFade {
    0%,100% { opacity: 0.25; }
    50%      { opacity: 0.8;  }
  }

  /* Handle flicker */
  .handle { animation: handleIn 1s ease-out 0.2s both, handleFlicker 6s ease-in-out 3s infinite; }
  @keyframes handleIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes handleFlicker {
    0%,90%,100% { opacity: 1; }
    91%          { opacity: 0.5; }
    92%          { opacity: 1;   }
    93%          { opacity: 0.3; }
    94%          { opacity: 1;   }
  }

  /* Name cinematic reveal */
  .name { animation: nameReveal 1.8s cubic-bezier(0.16,1,0.3,1) 0.5s both; }
  @keyframes nameReveal {
    0%   { opacity: 0; letter-spacing: 12px; }
    100% { opacity: 1; letter-spacing: 3px;  }
  }

  /* Subtitle and extras */
  .sub  { animation: fadeUp 1.2s ease-out 1.6s both; }
  .line { animation: drawLine 1.4s ease-out 2.2s both; }
  .mot  { animation: fadeUp 1.2s ease-out 2.8s both; }
  .ft   { animation: fadeUp 1.2s ease-out 3.4s both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0);   }
  }

  /* Underline draw */
  .und {
    stroke-dasharray: 380;
    stroke-dashoffset: 380;
    animation: drawLine 1.4s ease-out 2.2s both, undPulse 4s ease-in-out 4s infinite;
  }
  @keyframes drawLine { to { stroke-dashoffset: 0; } }
  @keyframes undPulse {
    0%,100% { opacity: 0.4; }
    50%      { opacity: 1;   }
  }

  /* Dot endpoints */
  .dot { animation: dotPulse 3s ease-in-out infinite; }
  @keyframes dotPulse {
    0%,100% { opacity: 0.3; }
    50%      { opacity: 1;   }
  }

  /* Rising particles */
  .p1 { animation: rise1 9s linear infinite; }
  .p2 { animation: rise1 12s linear -4s infinite; }
  .p3 { animation: rise1 7s linear -2s infinite; }
  .p4 { animation: rise1 11s linear -6s infinite; }
  .p5 { animation: rise1 15s linear -8s infinite; }
  @keyframes rise1 {
    0%  { transform: translateY(0px);    opacity: 0; }
    5%  { opacity: 0.7; }
    90% { opacity: 0.5; }
    100%{ transform: translateY(-260px); opacity: 0; }
  }

  /* Glitch clips on name */
  .gla { animation: glA 9s step-end infinite; opacity:0; }
  .glb { animation: glB 9s step-end infinite; opacity:0; }
  @keyframes glA {
    0%,82%,100% { opacity:0; clip-path:none; }
    83% { opacity:0.6; clip-path:inset(15% 0 60% 0); }
    84% { opacity:0; }
    85% { opacity:0.5; clip-path:inset(55% 0 10% 0); }
    86% { opacity:0; }
  }
  @keyframes glB {
    0%,82.5%,100% { opacity:0; clip-path:none; }
    83.5% { opacity:0.5; clip-path:inset(40% 0 30% 0); }
    84.5% { opacity:0; }
    85.5% { opacity:0.4; clip-path:inset(5% 0 75% 0); }
    86.5% { opacity:0; }
  }
</style>

<!-- ── GRADIENTS ── -->
<radialGradient id="bgc" cx="50%" cy="45%" r="70%">
  <stop offset="0%"   stop-color="#111118"/>
  <stop offset="100%" stop-color="#050507"/>
</radialGradient>

<!-- Left silver glow -->
<radialGradient id="gl" cx="0%" cy="40%" r="60%">
  <stop offset="0%"   stop-color="#c0c0c0" stop-opacity="0.08"/>
  <stop offset="100%" stop-color="#c0c0c0" stop-opacity="0"/>
</radialGradient>

<!-- Right silver glow -->
<radialGradient id="gr" cx="100%" cy="55%" r="55%">
  <stop offset="0%"   stop-color="#a0a0a0" stop-opacity="0.07"/>
  <stop offset="100%" stop-color="#a0a0a0" stop-opacity="0"/>
</radialGradient>

<!-- Top border: silver shimmer -->
<linearGradient id="tb" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
  <stop offset="20%"  stop-color="#888888" stop-opacity="0.6"/>
  <stop offset="50%"  stop-color="#ffffff" stop-opacity="1"/>
  <stop offset="80%"  stop-color="#888888" stop-opacity="0.6"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>

<!-- Bottom border: dimmer -->
<linearGradient id="bb" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
  <stop offset="30%"  stop-color="#555555" stop-opacity="0.5"/>
  <stop offset="50%"  stop-color="#888888" stop-opacity="0.7"/>
  <stop offset="70%"  stop-color="#555555" stop-opacity="0.5"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>

<!-- Scan beam -->
<linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
  <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.04"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>

<!-- Underline gradient -->
<linearGradient id="ug" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
  <stop offset="20%"  stop-color="#999999" stop-opacity="0.8"/>
  <stop offset="50%"  stop-color="#ffffff" stop-opacity="1"/>
  <stop offset="80%"  stop-color="#999999" stop-opacity="0.8"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>

<!-- Noise pattern (subtle grain) -->
<filter id="noise">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" result="noiseOut"/>
  <feColorMatrix in="noiseOut" type="saturate" values="0" result="grayNoise"/>
  <feComposite in="grayNoise" in2="SourceGraphic" operator="in"/>
</filter>

<!-- Soft name glow -->
<filter id="nglow" x="-8%" y="-25%" width="116%" height="150%">
  <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>

<!-- Handle glow -->
<filter id="hglow" x="-30%" y="-80%" width="160%" height="260%">
  <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>

<!-- ██ BACKGROUND ██ -->
<rect width="830" height="260" fill="url(#bgc)" rx="10"/>

<!-- Film grain overlay -->
<rect class="grain" width="830" height="260" fill="url(#bgc)" rx="10" filter="url(#noise)" opacity="0.05"/>

<!-- Ambient silver glows -->
<rect class="glow-l" width="830" height="260" fill="url(#gl)" rx="10"/>
<rect class="glow-r" width="830" height="260" fill="url(#gr)" rx="10"/>

<!-- ██ SCAN LINE ██ -->
<rect class="scan" width="830" height="60" fill="url(#sg)"/>

<!-- ██ HORIZONTAL RULE LINES (film strip aesthetic) ██ -->
<line x1="0" y1="28" x2="830" y2="28" stroke="#ffffff" stroke-width="0.4" opacity="0.05"/>
<line x1="0" y1="232" x2="830" y2="232" stroke="#ffffff" stroke-width="0.4" opacity="0.05"/>

<!-- ██ BORDERS ██ -->
<rect class="bdr-t" x="0" y="0"     width="830" height="2" fill="url(#tb)" rx="1"/>
<rect class="bdr-b" x="0" y="258"   width="830" height="2" fill="url(#bb)" rx="1"/>

<!-- ██ CORNER L-BRACKETS ██ -->
<g class="cr" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.6">
  <line x1="16" y1="14" x2="16" y2="38"/>
  <line x1="16" y1="14" x2="40" y2="14"/>
</g>
<g class="cr" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.6" style="animation-delay:-1.5s">
  <line x1="814" y1="14" x2="814" y2="38"/>
  <line x1="790" y1="14" x2="814" y2="14"/>
</g>
<g class="cr" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.6" style="animation-delay:-3s">
  <line x1="16" y1="246" x2="16" y2="222"/>
  <line x1="16" y1="246" x2="40"  y2="246"/>
</g>
<g class="cr" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.6" style="animation-delay:-0.8s">
  <line x1="814" y1="246" x2="814" y2="222"/>
  <line x1="790" y1="246" x2="814" y2="246"/>
</g>

<!-- ██ RISING PARTICLES ██ -->
<circle class="p1" cx="110" cy="255" r="1.5" fill="#aaaaaa" opacity="0"/>
<circle class="p2" cx="250" cy="255" r="1"   fill="#888888" opacity="0"/>
<circle class="p3" cx="415" cy="255" r="1.5" fill="#cccccc" opacity="0"/>
<circle class="p4" cx="590" cy="255" r="1"   fill="#aaaaaa" opacity="0"/>
<circle class="p5" cx="720" cy="255" r="1.5" fill="#888888" opacity="0"/>

<!-- ██ HANDLE ██ -->
<text class="handle" x="415" y="74"
  font-family="'Courier New',Courier,monospace"
  font-size="13" fill="#888888" text-anchor="middle"
  filter="url(#hglow)" letter-spacing="8" font-weight="400">
  &#47;&#47; 0xsnowZ
</text>

<!-- ██ NAME GLITCH COPIES ██ -->
<text class="gla" x="413" y="150"
  font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
  font-size="52" font-weight="900" fill="#aaaaaa" text-anchor="middle" letter-spacing="3px">
  MOHAMED EL GAROUANI
</text>
<text class="glb" x="417" y="150"
  font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
  font-size="52" font-weight="900" fill="#cccccc" text-anchor="middle" letter-spacing="3px">
  MOHAMED EL GAROUANI
</text>

<!-- ██ MAIN NAME ██ -->
<text class="name" x="415" y="150"
  font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
  font-size="52" font-weight="900"
  fill="#f5f5f5" text-anchor="middle"
  filter="url(#nglow)">
  MOHAMED EL GAROUANI
</text>

<!-- ██ SUBTITLE ██ -->
<text class="sub" x="415" y="176"
  font-family="'Courier New',Courier,monospace"
  font-size="11.5" fill="#555555" text-anchor="middle" letter-spacing="5">
  SOFTWARE ENGINEER  ·  FULL-STACK DEVELOPER
</text>

<!-- ██ ANIMATED UNDERLINE ██ -->
<line class="und" x1="225" y1="192" x2="605" y2="192"
  stroke="url(#ug)" stroke-width="1.2"/>
<circle class="dot" cx="225" cy="192" r="2" fill="#aaaaaa"/>
<circle class="dot" cx="605" cy="192" r="2" fill="#aaaaaa" style="animation-delay:-1.5s"/>

<!-- ██ MOTTO ██ -->
<text class="mot" x="415" y="216"
  font-family="'Courier New',Courier,monospace"
  font-size="10" fill="#333333" text-anchor="middle" letter-spacing="1">
  while(alive) { learn(); code(); improve(); }
</text>

<!-- ██ FOOTER ██ -->
<text class="ft" x="415" y="242"
  font-family="'Courier New',Courier,monospace"
  font-size="8.5" fill="#252525" text-anchor="middle" letter-spacing="2">
  Morocco  ·  snowz.tech  ·  @0xsnow_Z
</text>

</svg>