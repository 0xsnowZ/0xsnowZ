<svg width="830" height="72" viewBox="0 0 830 72" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    .fade { animation: fadeIn 1s ease-out both; }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  </style>
</defs>

<!-- Background -->
<rect width="830" height="72" fill="#1e1e1e" rx="6"/>

<!-- Top accent line (VSCode blue) -->
<rect width="830" height="2" fill="#007acc" rx="1"/>

<!-- Left: handle -->
<text class="fade" x="20" y="28"
  font-family="'Courier New',Courier,monospace"
  font-size="12" fill="#569cd6" font-weight="bold">// 0xsnowZ</text>

<!-- Left: links row -->
<text class="fade" x="20" y="56"
  font-family="'Courier New',Courier,monospace"
  font-size="11" fill="#555555">
  <tspan fill="#3c7dba">snowz.tech</tspan>
  <tspan fill="#444444">  ·  </tspan>
  <tspan fill="#3c7dba">linkedin</tspan>
  <tspan fill="#444444">  ·  </tspan>
  <tspan fill="#3c7dba">elgarouani01@gmail.com</tspan>
</text>

<!-- Center: motto as string -->
<text class="fade" x="415" y="42" text-anchor="middle"
  font-family="'Courier New',Courier,monospace"
  font-size="13" fill="#ce9178">"Trust The Process"</text>

<!-- Right: Morocco -->
<text class="fade" x="810" y="28" text-anchor="end"
  font-family="'Courier New',Courier,monospace"
  font-size="11" fill="#444444">Morocco · Remote-Friendly</text>

<!-- Right: Full-Stack Developer -->
<text class="fade" x="810" y="54" text-anchor="end"
  font-family="'Courier New',Courier,monospace"
  font-size="11" fill="#555555">Software Engineer · Full-Stack Dev</text>

</svg>
