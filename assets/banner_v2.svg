<svg width="830" height="260" viewBox="0 0 830 260" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  /* Sequential line-by-line reveal (typewriter) */
  .l1  { animation: lineIn .12s ease 0.3s  both; }
  .l2  { animation: lineIn .12s ease 0.7s  both; }
  .l3  { animation: lineIn .12s ease 1.1s  both; }
  .l4  { animation: lineIn .12s ease 1.5s  both; }
  .l5  { animation: lineIn .12s ease 1.9s  both; }
  .l6  { animation: lineIn .12s ease 2.3s  both; }
  .l7  { animation: lineIn .12s ease 2.7s  both; }
  .l8  { animation: lineIn .12s ease 3.1s  both; }
  .l9  { animation: lineIn .12s ease 3.5s  both; }
  .l10 { animation: lineIn .12s ease 3.9s  both; }
  @keyframes lineIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* Cursor blink — starts when typing finishes */
  .cursor { animation: blink .85s step-end 4.2s infinite; }
  @keyframes blink {
    0%,49% { opacity: 1; }
    50%,100%{ opacity: 0; }
  }

  /* Line numbers pulse subtly */
  .lnum { animation: lnumFade 0.15s ease 0.2s both; }
  @keyframes lnumFade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* Status bar entrance */
  .sbar { animation: lineIn .3s ease 0.1s both; }
</style>
</defs>

<!-- ██ EDITOR BACKGROUND ██ -->
<rect width="830" height="260" fill="#1e1e1e"/>

<!-- ██ TAB BAR ██ -->
<rect width="830" height="35" fill="#252526"/>

<!-- Inactive tabs -->
<text x="12" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#6a6a6a" letter-spacing="1">EXPLORER</text>
<line x1="110" y1="0" x2="110" y2="35" stroke="#1e1e1e" stroke-width="1"/>

<!-- Active tab: profile.js -->
<rect x="110" y="0" width="152" height="35" fill="#1e1e1e"/>
<rect x="110" y="0" width="152" height="2" fill="#007acc"/>
<!-- JS file icon badge -->
<rect x="126" y="10" width="13" height="13" fill="#f7df1e" rx="1.5"/>
<text x="129.5" y="20.5" font-family="'Courier New',monospace" font-size="6.5" fill="#1a1a1a" font-weight="bold">JS</text>
<!-- Tab label -->
<text x="146" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#cccccc">profile.js</text>
<!-- Modified dot -->
<circle cx="253" cy="17" r="3.5" fill="#cccccc" opacity="0.55"/>
<!-- Tab right separator -->
<line x1="262" y1="0" x2="262" y2="35" stroke="#3d3d3d" stroke-width="1"/>

<!-- More tabs hint -->
<text x="276" y="22" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#555">README.md</text>
<line x1="366" y1="0" x2="366" y2="35" stroke="#333" stroke-width="1"/>

<!-- ██ ACTIVITY BAR (left strip) ██ -->
<rect x="0" y="35" width="8" height="203" fill="#333333"/>

<!-- ██ GUTTER ██ -->
<rect x="8" y="35" width="46" height="203" fill="#1e1e1e"/>
<line x1="54" y1="35" x2="54" y2="238" stroke="#3c3c3c" stroke-width="1"/>

<!-- Line numbers -->
<g class="lnum" font-family="'Courier New',Courier,monospace" font-size="12" fill="#585858" text-anchor="end">
  <text x="47" y="58">1</text>
  <text x="47" y="76">2</text>
  <text x="47" y="94">3</text>
  <text x="47" y="112">4</text>
  <text x="47" y="130">5</text>
  <text x="47" y="148">6</text>
  <text x="47" y="166">7</text>
  <text x="47" y="184">8</text>
  <text x="47" y="202">9</text>
  <text x="47" y="220">10</text>
</g>

<!-- ██ CODE AREA ██ -->
<rect x="54" y="35" width="776" height="203" fill="#1e1e1e"/>

<!-- Active line highlight — moves down as each line is typed -->
<rect x="54" y="44" width="776" height="18" fill="#ffffff" opacity="0.05">
  <animate attributeName="y"
    values="44;62;80;98;116;134;152;170;188;206"
    keyTimes="0;0.11;0.22;0.33;0.44;0.55;0.66;0.77;0.88;1"
    dur="4.0s" calcMode="discrete" repeatCount="1" fill="freeze"/>
</rect>

<!-- ██ SYNTAX-HIGHLIGHTED CODE ██ -->
<g font-family="'Courier New',Courier,monospace" font-size="12.5">

  <!-- L1: // 0xsnowZ — profile.js -->
  <text class="l1" y="58">
    <tspan x="64" fill="#6a9955">// 0xsnowZ — profile.js</tspan>
  </text>

  <!-- L2: blank -->
  <text class="l2" y="76"><tspan x="64" fill="#d4d4d4"> </tspan></text>

  <!-- L3: const developer = { -->
  <text class="l3" y="94">
    <tspan x="64" fill="#569cd6">const </tspan>
    <tspan fill="#9cdcfe">developer</tspan>
    <tspan fill="#d4d4d4"> = {</tspan>
  </text>

  <!-- L4: name -->
  <text class="l4" y="112">
    <tspan x="79" fill="#9cdcfe">name</tspan>
    <tspan fill="#d4d4d4">     : </tspan>
    <tspan fill="#ce9178">"Mohamed EL GAROUANI"</tspan>
    <tspan fill="#d4d4d4">,</tspan>
  </text>

  <!-- L5: role (array) -->
  <text class="l5" y="130">
    <tspan x="79" fill="#9cdcfe">role</tspan>
    <tspan fill="#d4d4d4">     : [</tspan>
    <tspan fill="#ce9178">"Software Engineer"</tspan>
    <tspan fill="#d4d4d4">, </tspan>
    <tspan fill="#ce9178">"Full-Stack Dev"</tspan>
    <tspan fill="#d4d4d4">],</tspan>
  </text>

  <!-- L6: stack -->
  <text class="l6" y="148">
    <tspan x="79" fill="#9cdcfe">stack</tspan>
    <tspan fill="#d4d4d4">    : [</tspan>
    <tspan fill="#ce9178">"React"</tspan>
    <tspan fill="#d4d4d4">, </tspan>
    <tspan fill="#ce9178">"Next.js"</tspan>
    <tspan fill="#d4d4d4">, </tspan>
    <tspan fill="#ce9178">"TypeScript"</tspan>
    <tspan fill="#d4d4d4">, </tspan>
    <tspan fill="#ce9178">"Node.js"</tspan>
    <tspan fill="#d4d4d4">, </tspan>
    <tspan fill="#ce9178">"PHP"</tspan>
    <tspan fill="#d4d4d4">, </tspan>
    <tspan fill="#ce9178">"Laravel"</tspan>
    <tspan fill="#d4d4d4">],</tspan>
  </text>

  <!-- L7: location -->
  <text class="l7" y="166">
    <tspan x="79" fill="#9cdcfe">location</tspan>
    <tspan fill="#d4d4d4"> : </tspan>
    <tspan fill="#ce9178">"Morocco  ·  Remote-Friendly"</tspan>
    <tspan fill="#d4d4d4">,</tspan>
  </text>

  <!-- L8: status -->
  <text class="l8" y="184">
    <tspan x="79" fill="#9cdcfe">status</tspan>
    <tspan fill="#d4d4d4">   : </tspan>
    <tspan fill="#ce9178">"open to opportunities"</tspan>
    <tspan fill="#d4d4d4">,</tspan>
  </text>

  <!-- L9: motto -->
  <text class="l9" y="202">
    <tspan x="79" fill="#9cdcfe">motto</tspan>
    <tspan fill="#d4d4d4">    : </tspan>
    <tspan fill="#ce9178">"Trust The Process"</tspan>
  </text>

  <!-- L10: }; -->
  <text class="l10" y="220">
    <tspan x="64" fill="#d4d4d4">};</tspan>
  </text>

</g>

<!-- ██ BLINKING CURSOR (block cursor after line 10) ██ -->
<rect class="cursor" x="76" y="209" width="7" height="13" fill="#aeafad" opacity="0"/>

<!-- ██ MINIMAP (right side) ██ -->
<rect x="756" y="35" width="74" height="203" fill="#1a1a1a"/>
<line x1="756" y1="35" x2="756" y2="238" stroke="#333" stroke-width="1"/>
<!-- Minimap code representation (thin colored lines) -->
<g opacity="0.5">
  <rect x="763" y="47"  width="55" height="2.5" fill="#6a9955" rx="1"/>
  <rect x="763" y="58"  width="0"  height="2.5" fill="#d4d4d4" rx="1"/>
  <rect x="763" y="69"  width="42" height="2.5" fill="#569cd6" rx="1"/>
  <rect x="763" y="80"  width="62" height="2.5" fill="#ce9178" rx="1"/>
  <rect x="763" y="91"  width="65" height="2.5" fill="#ce9178" rx="1"/>
  <rect x="763" y="102" width="68" height="2.5" fill="#ce9178" rx="1"/>
  <rect x="763" y="113" width="60" height="2.5" fill="#ce9178" rx="1"/>
  <rect x="763" y="124" width="55" height="2.5" fill="#27c93f" rx="1"/>
  <rect x="763" y="135" width="50" height="2.5" fill="#ce9178" rx="1"/>
  <rect x="763" y="146" width="22" height="2.5" fill="#d4d4d4" rx="1"/>
</g>
<!-- Minimap viewport indicator -->
<rect x="758" y="40" width="70" height="120" fill="#ffffff" opacity="0.05" rx="1"/>

<!-- ██ STATUS BAR ██ -->
<rect class="sbar" x="0" y="238" width="830" height="22" fill="#007acc"/>
<!-- Left section -->
<text x="12" y="253" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="white" opacity="0.95">&#9135; main</text>
<text x="78" y="253" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="white" opacity="0.75">0 problems</text>
<!-- Center info -->
<text x="415" y="253" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">0xsnowZ &#183; Full-Stack Developer &#183; Morocco</text>
<!-- Right info -->
<text x="680" y="253" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="white" opacity="0.75">JavaScript</text>
<text x="750" y="253" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="white" opacity="0.75">UTF-8</text>
<text x="820" y="253" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="white" text-anchor="end" opacity="0.75">Ln 10, Col 3</text>

</svg>